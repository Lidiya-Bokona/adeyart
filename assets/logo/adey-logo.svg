<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- True-to-life petal gradient -->
    <linearGradient id="adeyPetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="35%" stop-color="#FFD000"/>
      <stop offset="85%" stop-color="#EAA000"/>
      <stop offset="100%" stop-color="#C67600"/>
    </linearGradient>

    <!-- Natural Disk Floret Radial Texture -->
    <radialGradient id="adeyDiskGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5B3310"/>
      <stop offset="45%" stop-color="#3A1E05"/>
      <stop offset="80%" stop-color="#241202"/>
      <stop offset="100%" stop-color="#140A01"/>
    </radialGradient>

    <!-- Outer Disk Pollen Glow -->
    <radialGradient id="adeyPollenRing" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#2A1402" stop-opacity="0"/>
      <stop offset="85%" stop-color="#F4B41A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Drop Shadow for Botanical Depth -->
    <filter id="naturalPetalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#2B1803" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(60, 60)" filter="url(#naturalPetalShadow)">
    <!-- Natural 8 Petals of Bidens Macroptera with authentic notched tips -->
    <!-- Petal 1 (0 deg) -->
    <g transform="rotate(0)">
      <path d="M -8,-15 C -12,-28 -11,-44 -6,-52 C -2,-55 0,-54 2,-55 C 6,-54 9,-52 11,-44 C 12,-28 8,-15 8,-15 Z" fill="url(#adeyPetalGrad)"/>
    </g>
    <!-- Petal 2 (45 deg) -->
    <g transform="rotate(45)">
      <path d="M -8,-15 C -12,-28 -11,-44 -6,-52 C -2,-55 0,-54 2,-55 C 6,-54 9,-52 11,-44 C 12,-28 8,-15 8,-15 Z" fill="url(#adeyPetalGrad)"/>
    </g>
    <!-- Petal 3 (90 deg) -->
    <g transform="rotate(90)">
      <path d="M -8,-15 C -12,-28 -11,-44 -6,-52 C -2,-55 0,-54 2,-55 C 6,-54 9,-52 11,-44 C 12,-28 8,-15 8,-15 Z" fill="url(#adeyPetalGrad)"/>
    </g>
    <!-- Petal 4 (135 deg) -->
    <g transform="rotate(135)">
      <path d="M -8,-15 C -12,-28 -11,-44 -6,-52 C -2,-55 0,-54 2,-55 C 6,-54 9,-52 11,-44 C 12,-28 8,-15 8,-15 Z" fill="url(#adeyPetalGrad)"/>
    </g>
    <!-- Petal 5 (180 deg) -->
    <g transform="rotate(180)">
      <path d="M -8,-15 C -12,-28 -11,-44 -6,-52 C -2,-55 0,-54 2,-55 C 6,-54 9,-52 11,-44 C 12,-28 8,-15 8,-15 Z" fill="url(#adeyPetalGrad)"/>
    </g>
    <!-- Petal 6 (225 deg) -->
    <g transform="rotate(225)">
      <path d="M -8,-15 C -12,-28 -11,-44 -6,-52 C -2,-55 0,-54 2,-55 C 6,-54 9,-52 11,-44 C 12,-28 8,-15 8,-15 Z" fill="url(#adeyPetalGrad)"/>
    </g>
    <!-- Petal 7 (270 deg) -->
    <g transform="rotate(270)">
      <path d="M -8,-15 C -12,-28 -11,-44 -6,-52 C -2,-55 0,-54 2,-55 C 6,-54 9,-52 11,-44 C 12,-28 8,-15 8,-15 Z" fill="url(#adeyPetalGrad)"/>
    </g>
    <!-- Petal 8 (315 deg) -->
    <g transform="rotate(315)">
      <path d="M -8,-15 C -12,-28 -11,-44 -6,-52 C -2,-55 0,-54 2,-55 C 6,-54 9,-52 11,-44 C 12,-28 8,-15 8,-15 Z" fill="url(#adeyPetalGrad)"/>
    </g>

    <!-- Central Core Anatomy -->
    <circle cx="0" cy="0" r="17" fill="url(#adeyDiskGrad)"/>
    <circle cx="0" cy="0" r="17" fill="url(#adeyPollenRing)"/>

    <!-- Fine Pollen Floret Dots -->
    <circle cx="-5" cy="-6" r="1.5" fill="#FBBF24" opacity="0.9"/>
    <circle cx="6" cy="-4" r="1.5" fill="#FBBF24" opacity="0.9"/>
    <circle cx="-2" cy="7" r="1.4" fill="#FBBF24" opacity="0.8"/>
    <circle cx="7" cy="5" r="1.3" fill="#F59E0B" opacity="0.9"/>
    <circle cx="-7" cy="2" r="1.4" fill="#F59E0B" opacity="0.85"/>
    <circle cx="0" cy="-9" r="1.2" fill="#FBBF24" opacity="0.9"/>
    <circle cx="10" cy="-8" r="1.2" fill="#D97706" opacity="0.75"/>
    <circle cx="-9" cy="-10" r="1.1" fill="#D97706" opacity="0.8"/>
  </g>
</svg>
